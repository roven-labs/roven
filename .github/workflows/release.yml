name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify source
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Package release
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "roven-release"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item target\release\roven.exe $staging
          Copy-Item README.md, CHANGELOG.md $staging
          Copy-Item docs\SETUP.md, docs\PROVIDERS.md, docs\TOOLS.md $staging
          $archive = Join-Path $env:RUNNER_TEMP "roven-windows-x86_64.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  roven-windows-x86_64.zip" | Set-Content (Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt")

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "$env:RUNNER_TEMP\roven-windows-x86_64.zip" `
            "$env:RUNNER_TEMP\SHA256SUMS.txt" `
            --verify-tag `
            --title "Roven $env:GITHUB_REF_NAME" `
            --generate-notes
