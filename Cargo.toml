[package]
name = "roven"
version = "1.0.0"
edition = "2024"
description = "Roven — Project Memory Assistant"
repository = "https://github.com/roven-labs/roven"
readme = "README.md"

[dependencies]
atomic-write-file = "0.3.0"
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
keyring = "4.1.6"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
unicode-width = "0.2.2"
rpassword = "7.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.17"
ureq = "3.4.0"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v7"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
